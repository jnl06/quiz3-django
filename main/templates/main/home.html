<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <style>
        body {
            background-color: rgb(25, 24, 24);
            align-content: center;
            text-align: center;
        }

        h1, h2, h4 {
            color: white;
        }

        h1 {
            margin: 40px;
        }

        .student {
            margin: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 300px;
            height: 150px;
            text-align: center;
            margin: 20px;
            border: solid;
            border-radius: 15px;
            border-color: rgb(202, 149, 35);
            background-color: rgb(104, 35, 35);
        }
    </style>
</head>
<body>
    <h1>STUDENT LIST</h1>
    <div class="student">
        {% for x in student %}
            <div class="card">
                <h2>{{ x.name }}</h2>
                <h4>Age: {{ x.age }}</h4>
                <h4>Course: {{ x.course }}</h4>
            </div>
        {% empty %}
            <p>No students found.</p>
        {% endfor %}
    </div>
</body>
</html>
